# Default values for my-chart.
# Override at install time: helm install my-release my-chart/ -f custom-values.yaml
# Or per-value: helm install my-release my-chart/ --set image.tag=v2.0.0

replicaCount: 2

image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overriding tag allows deploying a specific version without changing the chart
  tag: "1.30-alpine"

# Additional image pull secrets for private registries
imagePullSecrets: []
# - name: regcred

nameOverride: ""          # override chart name in resource names
fullnameOverride: ""      # override full resource name (chart-release)

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""    # if empty, auto-generated from release name

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podLabels: {}

podSecurityContext:
  runAsNonRoot: false   # nginx requires root for port 80

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
    add: ["NET_BIND_SERVICE"]

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
  - host: my-app.example.com
    paths:
    - path: /
      pathType: Prefix
  tls: []
  # - secretName: my-app-tls
  #   hosts:
  #   - my-app.example.com

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# Application-specific configuration
config:
  environment: production
  logLevel: info
  # These become a ConfigMap mounted at /etc/app/config.yaml
